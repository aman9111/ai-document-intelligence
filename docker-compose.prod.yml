# Production additions for a server with a public IP and a domain name.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy for HTTPS on ports 80 and 443. The frontend is no longer published
# directly; only Caddy is reachable from the internet.

services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. mydocs.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates are stored here, so they are not requested again on every restart
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be up to 10 MB (the backend checks the exact limit)
    client_max_body_size 12m;

    # Forward /api/... to the backend container: /api/documents -> backend:8000/documents
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming chat: send each piece to the browser right away, don't wait
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # React app: any other path loads index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
